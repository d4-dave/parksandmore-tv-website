<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Parks & More | TV, Radio & Planning</title>

  <meta
    name="description"
    content="Parks & More is bringing the resort experience home with resort-style TV, background music, park information, and vacation-planning tools."
  />

  <style>
    :root {
      --background-top: #071426;
      --background-bottom: #020711;
      --panel: rgba(10, 25, 45, 0.74);
      --border: rgba(255, 255, 255, 0.13);
      --text: #ffffff;
      --muted: #b8c5d8;
      --accent: #5ed5ff;
      --accent-secondary: #8f79ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
      color: var(--text);
      font-family:
        Inter,
        Avenir,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      background:
        radial-gradient(
          circle at 25% 20%,
          rgba(94, 213, 255, 0.16),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 75%,
          rgba(143, 121, 255, 0.15),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          var(--background-top),
          var(--background-bottom)
        );
    }

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image:
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.8) 1px,
          transparent 1.5px
        ),
        radial-gradient(
          circle,
          rgba(255, 255, 255, 0.45) 1px,
          transparent 1.5px
        );
      background-position: 0 0, 45px 70px;
      background-size: 115px 115px, 165px 165px;
      opacity: 0.3;
    }

    .stars::before {
      transform: scale(1.35);
      opacity: 0.2;
    }

    .stars::after {
      transform: scale(1.8);
      opacity: 0.12;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(860px, 100%);
      padding: clamp(38px, 7vw, 76px);
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .tagline {
      margin: 0 0 22px;
      color: var(--accent);
      font-size: clamp(0.82rem, 1.7vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      white-space: nowrap;
      font-size: clamp(2.75rem, 9vw, 6.7rem);
      font-weight: 800;
      letter-spacing: -0.065em;
      line-height: 0.95;
    }

    .services {
      margin-top: 18px;
      color: transparent;
      font-size: clamp(1rem, 3vw, 1.65rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(
        90deg,
        var(--accent),
        #ffffff,
        var(--accent-secondary)
      );
      background-clip: text;
      -webkit-background-clip: text;
    }

    .divider {
      width: 76px;
      height: 3px;
      margin: 30px auto;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--accent),
        var(--accent-secondary)
      );
    }

    .description {
      max-width: 610px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.18rem);
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 32px;
      padding: 10px 16px;
      color: #dce8f8;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 24px;
      margin-top: 36px;
      font-size: 0.94rem;
    }

    .contact a {
      color: #e5edf8;
      text-decoration: none;
      transition:
        color 160ms ease,
        transform 160ms ease;
    }

    .contact a:hover,
    .contact a:focus-visible {
      color: var(--accent);
      transform: translateY(-1px);
    }

    footer {
      margin-top: 28px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 0.78rem;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--accent);
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @media (max-width: 620px) {
      main {
        padding: 42px 22px;
        border-radius: 22px;
      }

      h1 {
        font-size: clamp(2.2rem, 12vw, 4.2rem);
        letter-spacing: -0.05em;
      }

      .services {
        letter-spacing: 0.12em;
      }

      .contact {
        flex-direction: column;
        gap: 10px;
      }
    }

    @media (max-width: 390px) {
      h1 {
        font-size: 2.05rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot {
        animation: none;
      }

      .contact a {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <div class="stars" aria-hidden="true"></div>

  <main>
    <p class="tagline">Bringing the resort experience home</p>

    <h1>Parks &amp; More</h1>

    <div class="services">TV &bull; Radio &bull; Planning</div>

    <div class="divider"></div>

    <p class="description">
      Resort-style programming, park information, background music,
      vacation-planning tools, and more are on the way.
    </p>

    <div class="status">
      <span class="status-dot" aria-hidden="true"></span>
      Currently preparing for launch
    </div>

    <div class="contact">
      <a href="mailto:info@parksandmore.tv">
        info@parksandmore.tv
      </a>

      <a
        href="https://d4designs.shop"
        target="_blank"
        rel="noopener noreferrer"
      >
        A project by D4 Designs
      </a>
    </div>

    <footer>
      &copy; <span id="year"></span> Parks &amp; More
      &nbsp;&bull;&nbsp;
      <a
        href="https://d4designs.shop"
        target="_blank"
        rel="noopener noreferrer"
      >
        d4designs.shop
      </a>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
