<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Parks & More TV | Coming Soon</title>

  <meta
    name="description"
    content="Parks & More TV is coming soon with relaxing resort-style programming, park information, music, and more."
  />

  <style>
    :root {
      --background-top: #071426;
      --background-bottom: #020711;
      --panel: rgba(10, 25, 45, 0.72);
      --border: rgba(255, 255, 255, 0.13);
      --text: #ffffff;
      --muted: #b8c5d8;
      --accent: #5ed5ff;
      --accent-secondary: #8f79ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      color: var(--text);
      font-family:
        Inter, Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(
          circle at 25% 20%,
          rgba(94, 213, 255, 0.16),
          transparent 32%
        ),
        radial-gradient(
          circle at 80% 75%,
          rgba(143, 121, 255, 0.15),
          transparent 34%
        ),
        linear-gradient(
          145deg,
          var(--background-top),
          var(--background-bottom)
        );
    }

    .stars,
    .stars::before,
    .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image:
        radial-gradient(circle, rgba(255,255,255,.8) 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1.5px);
      background-position: 0 0, 45px 70px;
      background-size: 115px 115px, 165px 165px;
      opacity: 0.3;
    }

    .stars::before {
      transform: scale(1.35);
      opacity: 0.2;
    }

    .stars::after {
      transform: scale(1.8);
      opacity: 0.12;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(760px, 100%);
      padding: clamp(38px, 7vw, 72px);
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin-bottom: 18px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.065em;
      line-height: 0.92;
    }

    h1 span {
      display: block;
      margin-top: 12px;
      color: transparent;
      font-size: 0.55em;
      letter-spacing: 0.03em;
      background: linear-gradient(
        90deg,
        var(--accent),
        #ffffff,
        var(--accent-secondary)
      );
      background-clip: text;
      -webkit-background-clip: text;
    }

    .divider {
      width: 72px;
      height: 3px;
      margin: 30px auto;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--accent),
        var(--accent-secondary)
      );
    }

    .description {
      max-width: 560px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.3vw, 1.2rem);
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 10px 16px;
      color: #dce8f8;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    footer {
      margin-top: 36px;
      color: rgba(255, 255, 255, 0.42);
      font-size: 0.78rem;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.9);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    @media (max-width: 520px) {
      main {
        padding: 38px 24px;
        border-radius: 22px;
      }

      h1 {
        letter-spacing: -0.045em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="stars" aria-hidden="true"></div>

  <main>
    <div class="eyebrow">Your vacation starts here</div>

    <h1>
      Parks
      <span>& More TV</span>
    </h1>

    <div class="divider"></div>

    <p class="description">
      Relaxing resort-style programming, park information, background music,
      transportation updates, and more are on the way.
    </p>

    <div class="status">
      <span class="status-dot" aria-hidden="true"></span>
      Currently preparing for launch
    </div>

    <footer>
      © <span id="year"></span> Parks & More TV
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
